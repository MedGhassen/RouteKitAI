name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string
      skip_tests:
        description: 'Skip running tests before publishing'
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          ruff check src/ tests/ examples/

      - name: Run type checking
        run: |
          mypy src/routekitai

      - name: Run tests
        run: |
          pytest tests/ -v

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Update version in __init__.py
        run: |
          VERSION="${{ inputs.version }}"
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" src/routekitai/__init__.py
          echo "Updated version to $VERSION"
          cat src/routekitai/__init__.py | grep __version__

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Check distribution
        run: |
          twine check dist/* 2>&1 | grep -v "license-file" || true
          echo "Built files:"
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/RouteKitAI
    permissions:
      id-token: write  # Required for OIDC/Trusted Publishing
      contents: write  # Required for checkout and creating releases
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify package version
        run: |
          echo "Publishing version: ${{ inputs.version }}"
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

      - name: Create GitHub Release
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ inputs.version }}';
            const tagName = `v${version}`;
            
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `RouteKitAI ${version}`,
              body: `## RouteKitAI ${version}\n\nPublished to PyPI successfully.\n\n### Installation\n\`\`\`bash\npip install RouteKitAI==${version}\n\`\`\``,
              draft: false,
              prerelease: false
            });
